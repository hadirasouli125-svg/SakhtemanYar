<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل مدیرکل ساختمان‌یار</title><style>body{font-family:Tahoma,Arial;background:#f4f7f7;color:#0f172a;margin:0}.wrap{max-width:1100px;margin:auto;padding:24px}.box{background:white;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 4px 18px #0000000d}input,button{padding:12px;border-radius:10px;border:1px solid #dbe3e3;margin:5px;font-size:15px}button{background:#0d9488;color:#fff;border:0;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.muted{color:#64748b}.item{border:1px solid #e2e8f0;border-radius:12px;padding:12px;margin:8px 0}</style></head><body><div class="wrap"><h1>ساختمان‌یار — مدیرکل</h1><div id="login" class="box"><h2>ورود مدیرکل</h2><input id="u" placeholder="نام کاربری"><input id="p" type="password" placeholder="رمز عبور"><button onclick="login()">ورود</button><div id="msg" class="muted"></div></div><div id="app" hidden><div class="box"><h2>تنظیمات سامانه</h2><div class="grid"><input id="appname" placeholder="نام برنامه"><input id="trial" type="number" placeholder="روز دوره آزمایشی"><input id="support" placeholder="شماره پشتیبانی"><label><input id="emailv" type="checkbox"> فعال‌سازی تأیید ایمیل</label><label><input id="gateway" type="checkbox"> فعال‌سازی درگاه پرداخت</label></div><button onclick="saveSettings()">ذخیره تنظیمات</button></div><div class="box"><h2>درخواست‌های اشتراک</h2><div id="requests"></div></div><div class="box"><h2>ساختمان‌ها</h2><div id="buildings"></div></div></div></div><script>const API='https://okizneyesdwiundvadpe.supabase.co/functions/v1/api';let token='';async function call(action,data={}){let r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:JSON.stringify({action,...data})});return r.json()}async function login(){let x=await call('admin_login',{username:u.value,password:p.value});if(!x.session){msg.textContent=x.error||'خطا';return}token=x.session;loginBox();load()}function loginBox(){document.getElementById('login').hidden=true;document.getElementById('app').hidden=false}async function load(){let x=await call('admin_dashboard');let s=x.settings||{};appname.value=s.app_name||'';trial.value=s.free_trial_days||30;support.value=s.support_phone||'';emailv.checked=!!s.email_verification_enabled;gateway.checked=!!s.payment_gateway_enabled;buildings.innerHTML=(x.buildings||[]).map(b=>`<div class=item><b>${esc(b.name)}</b><br>وضعیت: ${b.subscription_status}<br>پایان: ${b.subscription_expires_at||'-'}</div>`).join('')||'<span class=muted>موردی نیست</span>';requests.innerHTML=(x.requests||[]).map(r=>`<div class=item><b>درخواست ${r.id}</b><br>ساختمان: ${r.building_id}<br>طرح: ${r.plan_id}<br>وضعیت: ${r.status} ${r.status==='pending'?`<button onclick="approve('${r.id}')">تأیید</button>`:''}</div>`).join('')||'<span class=muted>درخواستی نیست</span>'}async function approve(id){let x=await call('admin_approve_subscription',{request_id:id});alert(x.error||'اشتراک فعال شد');load()}async function saveSettings(){let x=await call('admin_update_settings',{app_name:appname.value,free_trial_days:Number(trial.value||30),support_phone:support.value,email_verification_enabled:emailv.checked,payment_gateway_enabled:gateway.checked});alert(x.error||'تنظیمات ذخیره شد')}function esc(s){return String(s||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]))}</script></body></html>
