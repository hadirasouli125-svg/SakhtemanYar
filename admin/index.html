<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیرکل سامانه | ساختمان‌یار</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f3f7f9;color:#102a43}.wrap{max-width:1180px;margin:auto;padding:22px}.hero{background:linear-gradient(135deg,#0f766e,#164e63);color:#fff;border-radius:26px;padding:26px;margin-bottom:18px;box-shadow:0 18px 45px #0f766e22}.hero h1{margin:0 0 8px;font-size:28px}.muted{color:#64748b}.hero .muted{color:#d7f5f0}.box{background:#fff;border:1px solid #e4edf0;border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 10px 30px #102a430b}.login{max-width:430px;margin:12vh auto}.input{width:100%;padding:14px 15px;border:1px solid #d7e1e5;border-radius:14px;margin:6px 0;font-size:16px}.btn{border:0;border-radius:14px;padding:13px 18px;background:#0f766e;color:#fff;font-weight:800;cursor:pointer}.btn.secondary{background:#e7f3f1;color:#0f5f59}.btn.danger{background:#fee2e2;color:#991b1b}.wide{width:100%;margin-top:8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.stat{background:#f8fbfc;border:1px solid #e3edf0;border-radius:18px;padding:16px}.stat b{display:block;font-size:25px;margin-top:7px}.item{border:1px solid #e3ebef;border-radius:16px;padding:14px;margin:9px 0;background:#fff}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.tab{white-space:nowrap;border:0;border-radius:12px;padding:10px 15px;background:#edf4f5;color:#234;font-weight:700}.tab.active{background:#0f766e;color:#fff}.section{display:none}.section.active{display:block}.msg{padding:11px;border-radius:12px;margin-top:10px;background:#fff7ed;color:#9a3412}.success{background:#ecfdf5;color:#166534}</style></head><body><div class="wrap"><div id="login" class="box login"><div class="hero"><h1>ساختمان‌یار</h1><div class="muted">کنترل پنل مدیرکل سامانه</div></div><input id="u" class="input" placeholder="نام کاربری"><input id="p" class="input" type="password" placeholder="رمز عبور"><button class="btn wide" onclick="login()">ورود به کنترل پنل</button><div id="msg"></div></div><div id="app" hidden><div class="hero"><h1>کنترل پنل مدیرکل</h1><div class="muted">مدیریت ساختمان‌ها، اشتراک‌ها و تنظیمات مرکزی</div></div><div class="tabs"><button class="tab active" onclick="tab('overview',this)">داشبورد</button><button class="tab" onclick="tab('settings',this)">تنظیمات</button><button class="tab" onclick="tab('requests',this)">اشتراک‌ها</button><button class="tab" onclick="tab('buildings',this)">ساختمان‌ها</button></div><section id="overview" class="section active"><div id="stats" class="grid"></div></section><section id="settings" class="section"><div class="box"><h2>تنظیمات سامانه</h2><div class="grid"><input id="appname" class="input" placeholder="نام برنامه"><input id="trial" class="input" type="number" placeholder="دوره آزمایشی (روز)"><input id="support" class="input" placeholder="شماره پشتیبانی"><input id="email" class="input" placeholder="ایمیل پشتیبانی"><input id="logo" class="input" placeholder="آدرس لوگو"><label><input id="emailv" type="checkbox"> تأیید ایمیل</label><label><input id="gateway" type="checkbox"> درگاه پرداخت</label></div><button class="btn" onclick="saveSettings()">ذخیره تنظیمات</button></div></section><section id="requests" class="section"><div class="box"><h2>درخواست‌های اشتراک</h2><div id="requestList"></div></div></section><section id="buildings" class="section"><div class="box"><h2>ساختمان‌های ثبت‌شده</h2><div id="buildingList"></div></div></section><div style="text-align:left"><button class="btn danger" onclick="logout()">خروج</button></div></div></div><script>const API='https://okizneyesdwiundvadpe.supabase.co/functions/v1/api';let token='';let data={};async function call(action,body={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:JSON.stringify({action,...body})});return r.json()}async function login(){const x=await call('admin_login',{username:u.value.trim(),password:p.value});if(!x.session){msg.className='msg';msg.textContent=x.error||'ورود ناموفق';return}token=x.session;loginBox();load()}function loginBox(){login.hidden=true;app.hidden=false}function tab(id,b){document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');b.classList.add('active')}async function load(){data=await call('admin_dashboard');if(data.error){logout();return}let s=data.settings||{};appname.value=s.app_name||'ساختمان‌یار';trial.value=s.free_trial_days||30;support.value=s.support_phone||'';email.value=s.support_email||'';logo.value=s.logo_url||'';emailv.checked=!!s.email_verification_enabled;gateway.checked=!!s.payment_gateway_enabled;const bs=data.buildings||[],rs=data.requests||[];stats.innerHTML='<div class="stat">ساختمان‌ها<b>'+bs.length+'</b></div><div class="stat">درخواست‌های اشتراک<b>'+rs.filter(x=>x.status==='pending').length+'</b></div><div class="stat">طرح‌های اشتراک<b>'+(data.plans||[]).length+'</b></div><div class="stat">فعال<b>'+bs.filter(x=>x.subscription_status==='active').length+'</b></div>';buildingList.innerHTML=bs.map(b=>'<div class="item"><b>'+esc(b.name)+'</b><br><span class="muted">'+esc(b.address||'بدون آدرس')+'</span><br>وضعیت: '+esc(b.subscription_status)+'<br>پایان: '+esc(b.subscription_expires_at||'-')+'</div>').join('')||'<span class="muted">ساختمانی ثبت نشده است.</span>';requestList.innerHTML=rs.map(r=>'<div class="item"><b>درخواست اشتراک</b><br>ساختمان: '+esc(r.building_id)+'<br>طرح: '+esc(r.plan_id)+'<br>وضعیت: '+esc(r.status)+(r.status==='pending'?' <button class="btn" onclick="approve(\''+r.id+'\')">تأیید و فعال‌سازی</button>':'')+'</div>').join('')||'<span class="muted">درخواستی وجود ندارد.</span>'}async function approve(id){const x=await call('admin_approve_subscription',{request_id:id});alert(x.error||'اشتراک فعال شد');load()}async function saveSettings(){const x=await call('admin_update_settings',{app_name:appname.value,free_trial_days:Number(trial.value||30),support_phone:support.value,support_email:email.value,logo_url:logo.value,email_verification_enabled:emailv.checked,payment_gateway_enabled:gateway.checked});alert(x.error||'تنظیمات ذخیره شد');load()}function logout(){token='';app.hidden=true;login.hidden=false;p.value=''}function esc(s){return String(s||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]))}</script></body></html>
