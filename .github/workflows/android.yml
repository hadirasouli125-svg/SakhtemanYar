name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize web session security
        run: python3 tools/patch_web_session_security.py
      - name: Materialize generated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java app/page.tsx
          if git diff --cached --quiet; then
            echo "Source already matches repository source."
          else
            git commit -m "chore: materialize generated source"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk 'ساختمان یار.apk'
      - uses: actions/upload-artifact@v4
        with:
          name: SakhtemanYar-audit-fixed-apk
          path: 'ساختمان یار.apk'
      - name: Web build verification
        run: |
          npm install
          npm run build
