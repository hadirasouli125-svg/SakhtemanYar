name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply approved deterministic fixes
        run: python3 tools/fix12.py
      - name: Deterministic regression checks
        run: python3 tools/regression_check.py
      - name: Web build regression check
        run: npm install && npm run build
      - name: Commit approved source fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/sakhtemanyar/JalaliDate.java app/src/main/java/com/sakhtemanyar/MainActivity.java app/src/main/java/com/sakhtemanyar/AdminActivity.java app/page.tsx
          git diff --cached --quiet || git commit -m "Fix audited application defects"
          git push
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk 'ساختمان یار.apk'
      - uses: actions/upload-artifact@v4
        with:
          name: SakhtemanYar-audit-fixed-apk
          path: 'ساختمان یار.apk'
