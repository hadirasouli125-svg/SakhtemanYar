name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch admin logo picker
        run: python3 tools/patch_logo_picker.py
      - name: Patch charge and receipt UI
        run: python3 tools/patch_charges_receipts.py
      - name: Patch final UI
        run: python3 tools/patch_final_ui2.py
      - name: Patch dates safely
        run: python3 tools/patch_v4_ui.py
      - name: Patch v5 multi-unit and Persian date UI
        run: python3 tools/patch_v5_ui.py
      - name: Patch v6 compile compatibility
        run: python3 tools/patch_v6_compile.py
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk 'ساختمان یار.apk'
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SakhtemanYar-v5-debug-apk
          path: 'ساختمان یار.apk'
