name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch admin logo picker
        run: python3 tools/patch_logo_picker.py
      - name: Patch charge and receipt UI
        run: python3 tools/patch_charges_receipts.py
      - name: Patch final UI
        run: python3 tools/patch_final_ui2.py
      - name: Patch dates safely
        run: python3 tools/patch_v4_ui.py
      - name: Patch v5 multi-unit and Persian date UI
        run: python3 tools/patch_v5_ui.py
      - name: Patch v6 compile compatibility
        run: python3 tools/patch_v6_compile.py
      - name: Patch v7 card layout
        run: python3 tools/patch_v7_layout.py
      - name: Patch finance v8 workflow
        run: python3 tools/patch_finance_v8.py
      - name: Fix finance v8 Java escaping
        run: python3 tools/patch_finance_v8_fix.py
      - name: Fix finance v8 lambda capture
        run: python3 tools/patch_finance_v8_lambda_fix.py
      - name: Patch finance reports, settlements and admin layout V9
        run: python3 tools/patch_finance_report_v9.py
      - name: Patch responsive master-admin cards
        run: python3 tools/patch_admin_responsive_layout.py
      - name: Patch subscription V11
        run: python3 tools/patch_subscription_v11.py
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk 'ساختمان یار.apk'
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SakhtemanYar-v11-subscription-apk
          path: 'ساختمان یار.apk'
