name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch admin logo picker
        run: python3 tools/patch_logo_picker.py
      - name: Patch charge and receipt UI
        run: python3 tools/patch_charges_receipts.py
      - name: Patch final UI
        run: python3 tools/patch_final_ui2.py
      - name: Patch v2 allocation and detail UI
        run: python3 tools/patch_v2_ui.py
      - name: Patch v3 final payment and allocation UI
        run: python3 tools/patch_v3_ui.py
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bonyar-v2-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
